<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid #E8EDEF;font-family:Montserrat,sans-serif;">
  <div style="max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;flex:0 0 auto;">
      <img src="assets/hey-cubii-logo.png" alt="Hey Cubii" style="height:40px;width:auto;display:block;" />
    </a>
    <nav style="display:flex;align-items:center;gap:11px;flex-wrap:wrap;flex:1 1 auto;justify-content:flex-end;row-gap:8px;">
      <div style="position:relative;">
        <button type="button" onClick="{{ toggleServices }}" aria-haspopup="listbox" aria-expanded="{{ servicesOpen }}" style="display:flex;align-items:center;gap:5px;background:none;border:none;font-family:Montserrat,sans-serif;font-size:13px;font-weight:600;color:#0A0A0A;letter-spacing:-0.01em;white-space:nowrap;cursor:pointer;padding:0;" style-hover="color:#0090E8;">
          <span>{{ t.services }}</span>
          <span style="width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid currentColor;display:block;"></span>
        </button>
        <sc-if value="{{ servicesOpen }}" hint-placeholder-val="{{ false }}">
          <div role="listbox" style="position:absolute;top:calc(100% + 8px);left:0;background:#FFFFFF;border:1px solid #DCE7EB;border-radius:14px;box-shadow:0 16px 40px rgba(41,109,131,0.16);padding:6px;min-width:230px;z-index:60;">
            <a href="Residents.dc.html" style="display:block;font-size:14px;font-weight:600;color:#0A0A0A;text-decoration:none;padding:10px 12px;border-radius:9px;" style-hover="background:#F0FAFE;color:#0090E8;">{{ t.residents }}</a>
            <a href="FacilityManagers.dc.html" style="display:block;font-size:14px;font-weight:600;color:#0A0A0A;text-decoration:none;padding:10px 12px;border-radius:9px;" style-hover="background:#F0FAFE;color:#0090E8;">{{ t.facilityManagers }}</a>
            <a href="ServiceProviders.dc.html" style="display:block;font-size:14px;font-weight:600;color:#0A0A0A;text-decoration:none;padding:10px 12px;border-radius:9px;" style-hover="background:#F0FAFE;color:#0090E8;">{{ t.serviceProviders }}</a>
            <a href="Communes.dc.html" style="display:block;font-size:14px;font-weight:600;color:#0A0A0A;text-decoration:none;padding:10px 12px;border-radius:9px;" style-hover="background:#F0FAFE;color:#0090E8;">{{ t.communes }}</a>
          </div>
        </sc-if>
      </div>
      <a href="Product.dc.html" style="font-size:13px;font-weight:600;color:#0A0A0A;text-decoration:none;letter-spacing:-0.01em;white-space:nowrap;" style-hover="color:#0090E8;">{{ t.product }}</a>
      <a href="Pricing.dc.html" style="font-size:13px;font-weight:600;color:#0A0A0A;text-decoration:none;letter-spacing:-0.01em;white-space:nowrap;" style-hover="color:#0090E8;">{{ t.pricing }}</a>

      <div style="position:relative;">
        <button type="button" onClick="{{ toggleMenu }}" aria-haspopup="listbox" aria-expanded="{{ menuOpen }}" style="display:flex;align-items:center;gap:4px;border:1px solid #DCE7EB;background:#FFFFFF;color:#0A0A0A;font-family:Montserrat,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.03em;padding:7px 9px;border-radius:999px;cursor:pointer;white-space:nowrap;" style-hover="border-color:#00B5F1;color:#0090E8;">
          <span>{{ currentLabel }}</span>
          <span style="width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid currentColor;display:block;"></span>
        </button>
        <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
          <div role="listbox" style="position:absolute;top:calc(100% + 8px);right:0;background:#FFFFFF;border:1px solid #DCE7EB;border-radius:14px;box-shadow:0 16px 40px rgba(41,109,131,0.16);padding:6px;min-width:150px;z-index:60;">
            <sc-for list="{{ localeOptions }}" as="opt" hint-placeholder-count="4">
              <button type="button" onClick="{{ opt.select }}" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:none;text-align:left;font-family:Montserrat,sans-serif;font-size:14px;font-weight:600;color:#0A0A0A;padding:10px 12px;border-radius:9px;cursor:pointer;" style-hover="background:#F0FAFE;color:#0090E8;">
                <span>{{ opt.name }}</span>
                <span style="font-size:11px;font-weight:700;color:#878888;">{{ opt.code }}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <a href="Demo.dc.html" style="font-size:13px;font-weight:700;color:#FFFFFF;background:#00B5F1;padding:9px 16px;border-radius:999px;text-decoration:none;white-space:nowrap;transition:background 0.15s ease;" style-hover="background:#0090E8;">{{ t.bookDemo }}</a>
    </nav>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:80}}">
const TRANSLATIONS = {
  en: { services: "Services", residents: "For Residents & Homeowners", facilityManagers: "For Facility Managers", serviceProviders: "For Service Providers", communes: "For Municipalities", product: "Product", pricing: "Pricing", bookDemo: "Book a Demo" },
  pt: { services: "Serviços", residents: "Para Residentes e Proprietários", facilityManagers: "Para Gestores de Condomínio", serviceProviders: "Para Prestadores de Serviços", communes: "Para Municípios", product: "Produto", pricing: "Preços", bookDemo: "Marcar uma Demonstração" },
  es: { services: "Servicios", residents: "Para Residentes y Propietarios", facilityManagers: "Para Administradores de Fincas", serviceProviders: "Para Proveedores de Servicios", communes: "Para Municipios", product: "Producto", pricing: "Precios", bookDemo: "Reservar una Demo" },
  fr: { services: "Services", residents: "Pour les Résidents et Propriétaires", facilityManagers: "Pour les Gestionnaires Immobiliers", serviceProviders: "Pour les Prestataires de Services", communes: "Pour les Communes", product: "Produit", pricing: "Tarifs", bookDemo: "Réserver une Démo" }
};
const LOCALE_NAMES = { en: "English", pt: "Português", es: "Español", fr: "Français" };
const LOCALE_LABELS = { en: "EN", pt: "PT", es: "ES", fr: "FR" };
const LOCALES = ["en", "pt", "es", "fr"];

class Component extends DCLogic {
  state = { locale: "en", menuOpen: false, servicesOpen: false };

  componentDidMount() {
    try {
      const stored = window.localStorage.getItem("cubii-locale");
      if (LOCALES.includes(stored)) this.setState({ locale: stored });
    } catch (e) {}
    this._onChange = (ev) => this.setState({ locale: ev.detail });
    window.addEventListener("cubii-locale-change", this._onChange);
    this._onDocClick = (ev) => {
      if (this.state.menuOpen) this.setState({ menuOpen: false });
      if (this.state.servicesOpen) this.setState({ servicesOpen: false });
    };
    document.addEventListener("click", this._onDocClick);
  }

  componentWillUnmount() {
    window.removeEventListener("cubii-locale-change", this._onChange);
    document.removeEventListener("click", this._onDocClick);
  }

  selectLocale(code) {
    this.setState({ locale: code, menuOpen: false });
    try { window.localStorage.setItem("cubii-locale", code); } catch (e) {}
    window.dispatchEvent(new CustomEvent("cubii-locale-change", { detail: code }));
  }

  renderVals() {
    const locale = this.state.locale;
    const t = TRANSLATIONS[locale] || TRANSLATIONS.en;
    return {
      t,
      menuOpen: this.state.menuOpen,
      servicesOpen: this.state.servicesOpen,
      toggleServices: (ev) => { ev.stopPropagation(); this.setState(s => ({ servicesOpen: !s.servicesOpen, menuOpen: false })); },
      currentLabel: LOCALE_LABELS[locale],
      toggleMenu: (ev) => { ev.stopPropagation(); this.setState(s => ({ menuOpen: !s.menuOpen, servicesOpen: false })); },
      localeOptions: LOCALES.map(code => ({
        code: LOCALE_LABELS[code],
        name: LOCALE_NAMES[code],
        select: (ev) => { ev.stopPropagation(); this.selectLocale(code); }
      }))
    };
  }
}
</script>
</body>
</html>
